name: Auto BDIX IPTV

on:
  schedule:
    # প্রতিদিন প্রতি ৬ ঘণ্টায় একবার চেক করবে
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: sync-bdix-iptv
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch BDIX Playlist
        run: |
          mkdir -p bdix
          
          # রিপোজিটরি ক্লোন
          git clone --depth 1 https://github.com/abusaeeidx/Mrgify-BDIX-IPTV.git temp_bdix || true
          
          # সকল m3u/m3u8 ও json ফাইল কপি
          cp temp_bdix/*.m3u ./bdix/ 2>/dev/null || true
          cp temp_bdix/*.m3u8 ./bdix/ 2>/dev/null || true
          cp temp_bdix/*.json ./bdix/ 2>/dev/null || true
          
          rm -rf temp_bdix

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bdix/
          if git diff --staged --quiet; then
            echo "No updates detected in BDIX source."
          else
            git commit -m "Auto update BDIX IPTV: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push origin main
          fi
